<div class="container-centralizado">
  <div class="filtro-container">
    <mat-form-field appearance="standard" class="filtro-input">
      <mat-label>Pesquisar médico</mat-label>
      <input matInput (keyup)="applyFilter($event)" #input />
    </mat-form-field>
  </div>

  <div class="tabela-container mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort class="tabela-centralizada">

      <ng-container matColumnDef="nomeCompleto">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
        <td mat-cell *matCellDef="let medico"> {{medico.nomeCompleto}} </td>
      </ng-container>

      <ng-container matColumnDef="dataNascimento">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Data de Nascimento </th>
        <td mat-cell *matCellDef="let medico"> {{medico.dataNascimento | date:'dd/MM/yyyy'}} </td>
      </ng-container>

      <ng-container matColumnDef="crm">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> CRM </th>
        <td mat-cell *matCellDef="let medico"> {{medico.crm}} </td>
      </ng-container>

      <ng-container matColumnDef="cargo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Cargo </th>
        <td mat-cell *matCellDef="let medico"> {{medico.cargo}} </td>
      </ng-container>

      <ng-container matColumnDef="telefone">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Número de contato </th>
        <td mat-cell *matCellDef="let medico"> {{medico.telefone}} </td>
      </ng-container>

      <ng-container matColumnDef="cep">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> CEP </th>
        <td mat-cell *matCellDef="let medico"> {{medico.cep}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="7">Nenhum médico encontrado para "{{input.value}}"</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
  </div>
</div>
